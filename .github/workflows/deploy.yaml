name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
        - name : Checkout code
          uses: actions/checkout@v6

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
          with:
            role-to-assume: arn:aws:iam::343918153740:role/github-actions-oidc-role
            role-session-name: github-actions
            aws-region: eu-north-1

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v2
          with:
            terraform_version: 1.15.7

        - name: Terraform Init
          working-directory: ./infra
          run: terraform init

        - name: Terraform Plan
          working-directory: ./infra
          run: terraform plan -var="image_tag=${{ github.event.workflow_run.head_sha }}"

        - name: Terraform Apply
          working-directory: ./infra
          run: terraform apply -auto-approve -var="image_tag=${{ github.event.workflow_run.head_sha }}"
        
        - name: Health Check
          run: curl --fail https://tm.shoshin.org.uk/health