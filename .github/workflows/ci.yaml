
name: CI

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "GitHub Actions is working!"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t ecs-health-app:latest ./app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::343918153740:role/github-actions-oidc-role
          role-session-name: github-actions
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        run: docker tag ecs-health-app:latest 343918153740.dkr.ecr.eu-north-1.amazonaws.com/getsugatensho:latest